name: Deploy Web Version

# Builds the browser/phone version of AquaClean
# and publishes it to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag
        run: pip install "pygbag==0.9.3"

      - name: Prepare web build folder
        run: |
          mkdir webbuild
          cp game.py player.py fish.py pollution.py algae.py level.py ui.py settings.py data_manager.py webbuild/
          cp -r assets webbuild/assets
          cp main_web.py webbuild/main.py

      - name: Build with pygbag
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pygbag --build webbuild 2>&1 | tee pygbag.log
          status=${PIPESTATUS[0]}
          cat pygbag.log
          exit $status

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webbuild/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
