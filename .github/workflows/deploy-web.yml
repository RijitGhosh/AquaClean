name: Deploy Web Version

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pygbag==0.9.3"

      - name: Prepare web build folder
        run: |
          mkdir -p webbuild/assets

          cp game.py player.py fish.py pollution.py algae.py level.py ui.py settings.py data_manager.py webbuild/
          cp -r assets/. webbuild/assets/

          cat > webbuild/main.py <<'PY'
          # /// script
          # dependencies = [
          #   "pygame-ce",
          # ]
          # ///

          import asyncio
          import pygame
          from game import Game

          async def main():
              print("AquaClean web startup")
              print("Pygame module:", getattr(pygame, "__file__", "unknown"))
              print("Pygame init available:", hasattr(pygame, "init"))

              if not hasattr(pygame, "init"):
                  raise RuntimeError(
                      "pygame.init is missing. Check the pygame-ce dependency."
                  )

              game = Game()
              await game.run_async()

          asyncio.run(main())
          PY

          echo "Checking generated web entry point:"
          sed -n '1,30p' webbuild/main.py
          grep -q 'pygame-ce' webbuild/main.py

      - name: Build with pygbag
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pygbag --build --disable-sound-format-error --ume_block=0 webbuild

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webbuild/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
