name: Build AquaClean

# Runs automatically whenever a version tag (like v1.0) is pushed.
# Builds a real Windows .exe and a real macOS .app - no Python needed
# by whoever downloads them - and attaches both to a GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pygame pyinstaller
      - name: Build Windows executable
        run: pyinstaller AquaClean.spec
      - name: Zip the build
        run: Compress-Archive -Path dist\AquaClean -DestinationPath AquaClean-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AquaClean-Windows
          path: AquaClean-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pygame pyinstaller
      - name: Build macOS app
        run: pyinstaller AquaClean.spec
      - name: Zip the build
        run: |
          cd dist
          zip -r ../AquaClean-macOS.zip AquaClean.app
      - uses: actions/upload-artifact@v4
        with:
          name: AquaClean-macOS
          path: AquaClean-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - name: Flatten downloaded files
        run: |
          mkdir -p release
          cp downloads/AquaClean-Windows/AquaClean-Windows.zip release/
          cp downloads/AquaClean-macOS/AquaClean-macOS.zip release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
